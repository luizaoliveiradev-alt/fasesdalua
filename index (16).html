<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Robô Interativo - Fases da Lua</title>
<style>

:root {
    --eye-white: #f0faff;
    --dark-bg: #050505;
    --glow-soft: rgba(240,250,255,0.15);
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: var(--dark-bg);

    overflow: hidden;

    touch-action: manipulation;

    overscroll-behavior: none;

    user-select: none;
    -webkit-user-select: none;

}

body {

    display: flex;

    justify-content: center;
    align-items: center;

    min-height: 100dvh;

}


/* =========================================
   ORIENTAÇÃO
========================================= */

#orientation-overlay {

    position: fixed;

    inset: 0;

    background: #000;

    color: white;

    z-index: 99999;

    display: none;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    font-family: Arial,sans-serif;

}

#orientation-overlay div {

    font-size: 50px;

}

#orientation-overlay p {

    font-size: 18px;

}

@media (orientation:portrait) {

    #orientation-overlay {

        display:flex;

    }

}


/* =========================================
   ROSTO
========================================= */

.face-container {

    display:flex;

    justify-content:center;

    align-items:center;

    width:100vw;

    height:100vh;

    animation:float 5s ease-in-out infinite;

}

@keyframes float {

    0%,100% {

        transform:translateY(0);

    }

    50% {

        transform:translateY(-12px);

    }

}


/* =========================================
   OLHOS
========================================= */

.eyes-row {

    display:flex;

    align-items:center;

    justify-content:center;

    gap:clamp(60px,11vw,160px);

    width:100vw;

}


.eye {

    width:clamp(170px,22vw,330px);

    height:clamp(150px,20vw,290px);

    background:var(--eye-white);

    border-radius:80px;

    box-shadow:

        0 0 30px var(--glow-soft),

        0 0 70px rgba(240,250,255,0.07);

    transition:

        all .4s cubic-bezier(
            .175,
            .885,
            .32,
            1.275
        );

}


/* =========================================
   EXPRESSÃO DORMINDO
========================================= */

.sleeping .eye {

    width:clamp(140px,18vw,260px);

    height:8px;

    opacity:.2;

    border-radius:4px;

}


/* =========================================
   EXPRESSÃO FELIZ
========================================= */

.happy .eye {

    height:clamp(70px,10vw,130px);

    background:transparent;

    border-top:

        clamp(18px,2.5vw,30px)

        solid var(--eye-white);

    border-radius:

        100px 100px 0 0;

    box-shadow:none;

    transform:translateY(25px);

}


/* =========================================
   EXPRESSÃO PENSANDO
========================================= */

.thinking #eye-l {

    width:clamp(170px,22vw,330px);

    height:clamp(150px,20vw,290px);

}

.thinking #eye-r {

    width:clamp(170px,22vw,330px);

    height:clamp(100px,15vw,210px);

}


/* =========================================
   EXPRESSÃO RINDO
========================================= */

.laughing .eye {

    width:clamp(170px,22vw,330px);

    height:clamp(40px,6vw,75px);

    transform:skewX(10deg);

}


/* =========================================
   PISCADA
========================================= */

.blink .eye {

    transform:scaleY(0)!important;

}


/* =========================================
   RESPONSIVIDADE
========================================= */

@media (orientation:landscape) {

    .eye {

        width:22vw;

        height:20vw;

        max-width:330px;

        max-height:290px;

    }

}


@media (max-height:500px) and (orientation:landscape) {

    .eye {

        width:20vw;

        height:17vw;

        max-width:270px;

        max-height:225px;

    }

    .eyes-row {

        gap:10vw;

    }

}

</style>
</head>
<body class="sleeping">



<div id="orientation-overlay">

    <div>📱🔄</div>

    <p>
        Gire o dispositivo para deitado.
    </p>

</div>


<div class="face-container">

    <div class="eyes-row">

        <div id="eye-l" class="eye"></div>

        <div id="eye-r" class="eye"></div>

    </div>

</div>



<script>

/* =========================================
   VARIÁVEIS
========================================= */

const body = document.body;

let recognitionActive = false;
let robotSpeaking = false;
let step = "nome";
let userName = "";
let wakeLock = null;
let voices = [];
let audioCtx = null;
let robotAwake = false;


/* =========================================
   GERADOR DE SONS ROBÓTICOS
========================================= */

function inicializarAudioContext() {
    try {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        if (audioCtx && audioCtx.state === "suspended") {
            audioCtx.resume().catch(() => {});
        }
    } catch (e) {
        console.log("Áudio não disponível:", e);
    }
}

function tocarSomRobotico(tipo) {
    try {
        inicializarAudioContext();
        if (!audioCtx) return;

        const now = audioCtx.currentTime;

        if (tipo === "bip") {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = "sawtooth";
            osc.frequency.setValueAtTime(800, now);
            osc.frequency.exponentialRampToValueAtTime(400, now + 0.15);

            gain.gain.setValueAtTime(0.1, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start(now);
            osc.stop(now + 0.15);
        }

        else if (tipo === "processando") {
            for (let i = 0; i < 3; i++) {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = "square";
                osc.frequency.setValueAtTime(
                    600 + (i * 300),
                    now + (i * 0.08)
                );

                gain.gain.setValueAtTime(
                    0.08,
                    now + (i * 0.08)
                );

                gain.gain.exponentialRampToValueAtTime(
                    0.001,
                    now + (i * 0.08) + 0.07
                );

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(now + (i * 0.08));
                osc.stop(now + (i * 0.08) + 0.07);
            }
        }

    } catch (e) {
        console.log("Erro ao gerar áudio:", e);
    }
}


/* =========================================
   RECONHECIMENTO DE VOZ
========================================= */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

const recognition =
    SpeechRecognition ? new SpeechRecognition() : null;

if (recognition) {
    recognition.lang = "pt-BR";
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;
}


/* =========================================
   VOZES
========================================= */

function carregarVozes() {
    voices = window.speechSynthesis.getVoices();
}

carregarVozes();

if ("onvoiceschanged" in window.speechSynthesis) {
    window.speechSynthesis.onvoiceschanged = carregarVozes;
}


/* =========================================
   ESCOLHER VOZ
========================================= */

function encontrarMelhorVoz() {

    if (!voices.length) {
        carregarVozes();
    }

    const preferidos = [
        "google português do brasil",
        "luciana",
        "felipe",
        "daniel",
        "ricardo"
    ];

    let voz = voices.find(v => {

        const name = v.name.toLowerCase();
        const lang = v.lang.toLowerCase();

        return (
            (lang === "pt-br" || lang.startsWith("pt-br")) &&
            preferidos.some(p => name.includes(p))
        );
    });

    if (!voz) {
        voz = voices.find(v =>
            v.lang.toLowerCase().startsWith("pt-br")
        );
    }

    if (!voz) {
        voz = voices.find(v =>
            v.lang.toLowerCase().startsWith("pt")
        );
    }

    return voz || null;
}


/* =========================================
   WAKE LOCK
========================================= */

async function manterTelaAcesa() {

    try {

        if ("wakeLock" in navigator) {

            if (
                wakeLock &&
                !wakeLock.released
            ) {
                return;
            }

            wakeLock =
                await navigator.wakeLock.request("screen");

            console.log("Tela mantida acesa.");
        }

    } catch (e) {

        console.log(
            "Wake Lock não disponível:",
            e
        );
    }
}

document.addEventListener(
    "visibilitychange",
    () => {

        if (
            document.visibilityState === "visible" &&
            robotAwake
        ) {
            manterTelaAcesa();
        }

    }
);


/* =========================================
   MICROFONE
========================================= */

async function autorizarMicrofone() {

    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {

        console.log(
            "getUserMedia não está disponível."
        );

        return false;
    }

    try {

        const stream =
            await navigator.mediaDevices.getUserMedia({
                audio: true
            });

        /*
         * As faixas são encerradas imediatamente.
         * A permissão concedida fica associada ao site
         * conforme as regras do navegador.
         */
        stream.getTracks().forEach(track => {
            track.stop();
        });

        console.log("Microfone autorizado.");

        return true;

    } catch (e) {

        console.log(
            "Permissão do microfone não concedida:",
            e
        );

        return false;
    }
}


/* =========================================
   FALAR
========================================= */

function falar(texto, callback) {

    robotSpeaking = true;

    tocarSomRobotico("bip");

    if (
        recognition &&
        recognitionActive
    ) {

        try {
            recognition.stop();
        } catch (e) {}

    }

    recognitionActive = false;

    window.speechSynthesis.cancel();

    const msg =
        new SpeechSynthesisUtterance(texto);

    msg.lang = "pt-BR";

    msg.pitch = 0.6;

    msg.rate = 0.9;

    msg.volume = 1;

    const voz =
        encontrarMelhorVoz();

    if (voz) {
        msg.voice = voz;
    }

    msg.onstart = () => {
        robotSpeaking = true;
    };

    msg.onend = () => {

        robotSpeaking = false;

        if (callback) {
            callback();
        }

    };

    msg.onerror = () => {

        robotSpeaking = false;

        if (callback) {
            callback();
        }

    };

    setTimeout(() => {

        window.speechSynthesis.speak(msg);

    }, 150);
}


/* =========================================
   OUVIR RESPOSTA
========================================= */

function ouvirResposta(proximoPasso) {

    if (
        !recognition ||
        !robotAwake
    ) {
        return;
    }

    step = proximoPasso;

    setTimeout(() => {

        if (
            !recognition ||
            !robotAwake ||
            robotSpeaking ||
            recognitionActive
        ) {
            return;
        }

        try {

            recognitionActive = true;

            tocarSomRobotico("processando");

            recognition.start();

        } catch (e) {

            recognitionActive = false;

            console.log(
                "Não foi possível iniciar o microfone:",
                e
            );
        }

    }, 300);
}


/* =========================================
   DIÁLOGO
========================================= */

function iniciarDialogo() {

    body.className = "awake";

    falar(
        "Oi eu sou o robôzinho, qual seu nome?",
        () => {
            ouvirResposta("nome");
        }
    );
}


function depoisDoNome() {

    falar(

        userName
            ? `Legal te conhecer, ${userName}! Eu fui programado para te ensinar sobre as fases da lua`
            : "Legal te conhecer! Eu fui programado para te ensinar sobre as fases da lua",

        () => {

            setTimeout(() => {

                falar(

                    "Você conhece as principais fases da lua?",

                    () => {
                        ouvirResposta("conhece_fases");
                    }

                );

            }, 2000);

        }
    );
}


function depoisDasFases() {

    falar(

        "Muito bem! A lua tem quatro fases principais, Lua Nova, Lua Crescente, Lua Cheia e Lua Minguante",

        () => {

            setTimeout(() => {

                falar(

                    "Você sabe em qual lua estamos hoje?",

                    () => {
                        ouvirResposta("lua_atual");
                    }

                );

            }, 2000);

        }
    );
}


function depoisDaLua() {

    falar(

        "Estamos na lua minguante, indo para a lua nova. Legal, né?",

        () => {
            ouvirResposta("reacao_lua");
        }

    );
}


function finalizarDialogo() {

    falar(

        "Saber sobre a lua nos ajuda a compreender sobre a natureza, como a astronomia, agricultura e até acompanhar ciclos",

        () => {

            setTimeout(() => {

                falar(

                    "Bom, agora preciso voltar a dormir pois logo a lua estará de volta. Tchau tchau!",

                    () => {
                        dormirRobo();
                    }

                );

            }, 2000);

        }
    );
}


/* =========================================
   EXTRAÇÃO DE NOME
========================================= */

function extrairNome(fala) {

    let limpo =
        fala
            .toLowerCase()
            .replace(/meu nome é/g, "")
            .replace(/meu nome e/g, "")
            .replace(/me chamo/g, "")
            .replace(/eu sou o/g, "")
            .replace(/eu sou a/g, "")
            .replace(/eu sou/g, "")
            .replace(/sou o/g, "")
            .replace(/sou a/g, "")
            .replace(/oi/g, "")
            .replace(/olá/g, "")
            .replace(/ola/g, "")
            .trim();

    if (!limpo) {
        return "";
    }

    let partes =
        limpo.split(/\s+/);

    let primeiroNome =
        partes[0];

    return (
        primeiroNome.charAt(0).toUpperCase() +
        primeiroNome.slice(1)
    );
}


/* =========================================
   RECONHECIMENTO
========================================= */

if (recognition) {

    recognition.onresult = (event) => {

        if (
            robotSpeaking ||
            !robotAwake
        ) {
            return;
        }

        const last =
            event.results.length - 1;

        const fala =
            event.results[last][0]
                .transcript
                .toLowerCase()
                .trim();

        console.log(
            "Usuário:",
            fala
        );

        recognitionActive = false;

        try {
            recognition.stop();
        } catch (e) {}

        /* =====================================
           NOME
        ===================================== */

        if (step === "nome") {

            userName =
                extrairNome(fala);

            if (!userName) {

                falar(

                    "Não consegui entender seu nome. Pode falar de novo?",

                    () => {
                        ouvirResposta("nome");
                    }

                );

                return;
            }

            depoisDoNome();

            return;
        }


        /* =====================================
           CONHECE AS FASES
        ===================================== */

        if (step === "conhece_fases") {

            const respondeuSim =
                fala.includes("sim") ||
                fala.includes("conheço") ||
                fala.includes("conheco");

            const respondeuNao =
                fala.includes("não") ||
                fala.includes("nao");

            if (
                respondeuSim ||
                respondeuNao
            ) {

                depoisDasFases();

            } else {

                falar(

                    "Pode responder sim ou não. Você conhece as principais fases da lua?",

                    () => {
                        ouvirResposta("conhece_fases");
                    }

                );
            }

            return;
        }


        /* =====================================
           LUA ATUAL
        ===================================== */

        if (step === "lua_atual") {

            const respondeuSim =
                fala.includes("sim") ||
                fala.includes("sei") ||
                fala.includes("conheço") ||
                fala.includes("conheco");

            const respondeuNao =
                fala.includes("não") ||
                fala.includes("nao");

            if (
                respondeuSim ||
                respondeuNao
            ) {

                depoisDaLua();

            } else {

                falar(

                    "Pode responder sim ou não. Você sabe em qual lua estamos hoje?",

                    () => {
                        ouvirResposta("lua_atual");
                    }

                );
            }

            return;
        }


        /* =====================================
           REAÇÃO À LUA
        ===================================== */

        if (step === "reacao_lua") {

            finalizarDialogo();

            return;
        }

    };


    recognition.onend = () => {

        recognitionActive = false;

        /*
         * Alguns navegadores encerram a escuta
         * automaticamente. Se o robô ainda estiver
         * esperando uma resposta, tentamos novamente.
         */

        if (
            robotAwake &&
            !robotSpeaking &&
            (
                step === "nome" ||
                step === "conhece_fases" ||
                step === "lua_atual" ||
                step === "reacao_lua"
            )
        ) {

            setTimeout(() => {

                if (
                    robotAwake &&
                    !robotSpeaking &&
                    !recognitionActive
                ) {

                    try {

                        recognitionActive = true;

                        recognition.start();

                    } catch (e) {

                        recognitionActive = false;
                    }

                }

            }, 500);

        }

    };


    recognition.onerror = (event) => {

        recognitionActive = false;

        console.log(
            "Erro:",
            event.error
        );

        if (
            event.error === "not-allowed" ||
            event.error === "service-not-allowed"
        ) {

            console.log(
                "O navegador bloqueou o acesso ao microfone."
            );
        }

    };

}


/* =========================================
   TELA CHEIA
========================================= */

async function entrarTelaCheia() {

    try {

        if (
            !document.fullscreenElement &&
            document.documentElement.requestFullscreen
        ) {

            /*
             * Esta chamada precisa ocorrer durante a
             * interação do usuário. O primeiro toque
             * chama esta função.
             */

            await document.documentElement.requestFullscreen({
                navigationUI: "hide"
            });

        }

    } catch (e) {

        console.log(
            "Tela cheia não disponível neste ambiente:",
            e
        );

    }
}


/* =========================================
   ACORDAR
========================================= */

async function acordarRobo() {

    if (robotAwake) {
        return;
    }

    robotAwake = true;

    /*
     * As duas solicitações são disparadas no primeiro
     * toque do usuário.
     */

    inicializarAudioContext();

    const fullscreenPromise =
        entrarTelaCheia();

    const microphonePromise =
        autorizarMicrofone();

    manterTelaAcesa();

    await Promise.allSettled([
        fullscreenPromise,
        microphonePromise
    ]);

    body.className = "awake";

    iniciarDialogo();
}


/* =========================================
   DORMIR
========================================= */

function dormirRobo() {

    robotAwake = false;

    recognitionActive = false;

    step = "nome";

    body.className = "sleeping";

    window.speechSynthesis.cancel();

    if (recognition) {

        try {
            recognition.stop();
        } catch (e) {}

    }

}


/* =========================================
   PRIMEIRO TOQUE
========================================= */

/*
 * O robô começa dormindo.
 * O primeiro toque acorda o robô, solicita o
 * microfone e entra em tela cheia.
 */

window.addEventListener(
    "pointerdown",
    acordarRobo,
    {
        once: true,
        passive: true
    }
);


/* =========================================
   BLOQUEAR ZOOM
========================================= */

document.addEventListener(
    "gesturestart",
    e => e.preventDefault()
);

document.addEventListener(
    "gesturechange",
    e => e.preventDefault()
);

document.addEventListener(
    "gestureend",
    e => e.preventDefault()
);

</script>
</body>
</html>
